<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラオケ管理アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>カラオケレパートリー</h2>
    
    <div class="tab-header">
      <div id="tabs-container" class="tabs"></div>
      <button id="add-tab-btn" class="btn-small">＋ 新規タブ</button>
    </div>

    <div class="input-area">
      
      <div class="autocomplete-wrapper">
        <input type="text" id="artist-input" placeholder="歌手名" autocomplete="off">
        <ul id="custom-artist-list" class="custom-dropdown" style="display: none;"></ul>
      </div>

      <input type="text" id="song-input" placeholder="曲名">
      <button id="add-song-btn" class="btn-primary">追加</button>
    </div>

    <div class="controls">
      <div class="sort-group">
        <button id="sort-btn" class="btn-secondary">歌手名でソート</button>
        <button id="sort-star-btn" class="btn-secondary">お気に入りでソート</button>
      </div>
      <button id="clear-checks-btn" class="btn-danger">チェッククリア</button>
    </div>

    <ul id="song-list" class="song-list"></ul>
    
    <div id="custom-confirm" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <p>現在のタブの内容をコピーしますか？</p>
        <p class="modal-subtext">（「いいえ」を押すと空のタブが作成されます）</p>
        <div class="modal-buttons">
          <button id="modal-yes" class="btn-primary">はい（コピーする）</button>
          <button id="modal-no" class="btn-secondary">いいえ（空のタブ）</button>
        </div>
      </div>
    </div>

    <div id="rename-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <p>新しいタブ名を入力してください:</p>
        <input type="text" id="rename-input" style="width: 100%; margin-bottom: 20px; padding: 10px; font-size: 1em; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        <div class="modal-buttons">
          <button id="rename-ok" class="btn-primary">OK</button>
          <button id="rename-cancel" class="btn-secondary">キャンセル</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <script src="main.js"></script>
</body>
</html>
